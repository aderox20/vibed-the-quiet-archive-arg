<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Index Lookup — Quiet Archive</title><style>body{max-width:680px;margin:12vh auto;padding:20px;background:#101310;color:#d8dfd1;font:15px/1.8 monospace}a{color:#b7d69b}input,button{font:inherit;background:#171c17;color:#d8dfd1;border:1px solid #465044;padding:10px}input{width:65%}button{cursor:pointer}.muted{color:#899585}</style></head><body><div class="muted">QUIET ARCHIVE / INDEX LOOKUP</div><h1 style="font-weight:400">Search the index</h1><p>Search by a known record identifier. Search terms are not supported in this terminal.</p><form id="f"><input id="q" placeholder="Record ID" autocomplete="off" required><button>LOOK UP</button></form><p id="out" aria-live="polite"></p><p><a href="index.html">← Return to index</a></p><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();let v=document.getElementById('q').value.trim();let o=document.getElementById('out');if(v==='214'||v==='0214'){o.innerHTML='Cache hit: <a href="records/214.html">record 214 (unindexed)</a>'}else if(v==='13'||v==='013'){o.textContent='Record 013 is flagged as a duplicate. See General Records.'}else{o.textContent='No indexed match. Try a record ID shown in the public collection.'}};</script></body></html>
